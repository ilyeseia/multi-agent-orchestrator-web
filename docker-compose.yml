version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: orchestrator_db
    environment:
      POSTGRES_USER: orchestrator
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: orchestrator_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orchestrator"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: orchestrator_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: orchestrator_web
    environment:
      - DATABASE_URL=postgresql://orchestrator:secure_password_123@db:5432/orchestrator_db
      - REDIS_URL=redis://redis:6379/0
      - FLASK_ENV=production
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: gunicorn --bind 0.0.0.0:5000 app:app

  celery_worker:
    build: .
    container_name: orchestrator_celery_worker
    environment:
      - DATABASE_URL=postgresql://orchestrator:secure_password_123@db:5432/orchestrator_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: celery -A app.celery:celery_app worker --loglevel=info

volumes:
  postgres_data:

 
