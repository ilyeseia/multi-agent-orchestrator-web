{% extends 'base.html' %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<h2>Dashboard</h2>
<a href="{{ url_for('project.new_project') }}">Create New Project</a>

<div class="projects-list">
    {% for project in projects %}
        <div class="project-card">
            <h3>{{ project.name }}</h3>
            <p>{{ project.description }}</p>
            <a href="{{ url_for('project.view_project', project_id=project.id) }}">View</a>
        </div>
    {% else %}
        <p>No projects yet.</p>
    {% endfor %}
</div>
{% endblock %}
