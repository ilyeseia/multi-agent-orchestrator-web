{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}

{% block content %}
<h1 class="text-3xl font-bold mb-6">Welcome, {{ user.username }}</h1>

<div class="mb-4">
    <a href="{{ url_for('project.new_project') }}" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">New Project</a>
</div>

<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
    {% for project in projects %}
    <div class="bg-white p-4 rounded shadow">
        <h2 class="text-xl font-bold">{{ project.name }}</h2>
        <p class="text-gray-600">{{ project.description }}</p>
        <a href="{{ url_for('project.view_project', project_id=project.id) }}" class="text-blue-600 hover:underline mt-2 inline-block">View</a>
    </div>
    {% else %}
    <p>No projects found.</p>
    {% endfor %}
</div>
{% endblock %}
