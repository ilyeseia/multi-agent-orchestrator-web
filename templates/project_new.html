{% extends "base.html" %}
{% block title %}New Project{% endblock %}

{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded shadow">
    <h2 class="text-2xl font-bold mb-4">Create New Project</h2>
    <form method="POST">
        <div class="mb-4">
            <label class="block mb-1">Project Name</label>
            <input type="text" name="name" class="w-full border p-2 rounded" required>
        </div>
        <div class="mb-4">
            <label class="block mb-1">Description</label>
            <textarea name="description" class="w-full border p-2 rounded" rows="4"></textarea>
        </div>
        <button type="submit" class="w-full bg-blue-600 text-white p-2 rounded hover:bg-blue-700">Create</button>
    </form>
</div>
{% endblock %}
